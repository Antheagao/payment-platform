# Weekly dependency updates, grouped so minor and patch bumps arrive as one pull request per ecosystem.
# Security updates are not grouped and arrive as soon as an advisory is published.
#
# Major versions that must move together with a runtime or a framework are ignored here and upgraded
# deliberately: Node stays on the 22 LTS line (image and types), TypeScript and ESLint follow what
# Next.js supports, and the .NET images follow the target framework in Directory.Build.props.

version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: dotnet/sdk
        update-types: [version-update:semver-major]
      - dependency-name: dotnet/aspnet
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
