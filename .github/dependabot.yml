# Weekly dependency updates, grouped so minor and patch bumps arrive as one pull request per ecosystem.
# Security updates are not grouped and arrive as soon as an advisory is published.
#
# Major versions that must move together with a runtime or a framework are ignored here and upgraded
# deliberately: Node stays on the 22 LTS line (images, compose's included, and types), TypeScript and
# ESLint follow what Next.js supports, and the .NET images follow the target framework in
# Directory.Build.props. k6 stays on the version docs/load-test.md was measured with.

version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # The dashboard's tracing (src/instrumentation.ts) moves as one: @vercel/otel pins each OpenTelemetry
      # package to a range, and a bump of one without the others does not install (the npm group's
      # pull request #6 failed `npm ci` that way). The 3.0 SDK is ignored below until it does.
      opentelemetry:
        patterns: ["@opentelemetry/*", "@vercel/otel"]
      npm-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@opentelemetry/*", "@vercel/otel"]
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # OpenTelemetry JS 3.0 (API 1.10, SDK 3.0, experimental 0.300) is outside @vercel/otel 2.1's peer
      # ranges, so `npm ci` fails (pull requests #10 and #11). Lift these when @vercel/otel accepts it.
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      - dependency-name: "@opentelemetry/resources"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/sdk-metrics"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/sdk-trace-base"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/api-logs"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/instrumentation"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/sdk-logs"
        versions: [">=0.300.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: dotnet/sdk
        update-types: [version-update:semver-major]
      - dependency-name: dotnet/aspnet
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The webhook receiver runs on the same Node line as the dashboard (pull request #9 proposed 25).
      - dependency-name: node
        update-types: [version-update:semver-major]
      # The load test's results are k6 2.2.0's; a new k6 comes with a new run of docs/load-test.md.
      - dependency-name: grafana/k6
