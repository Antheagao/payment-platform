# The whole platform on one machine, with one command and no setup: `docker compose up --build`.
#
#   Dashboard           http://localhost:3080
#   API                 http://localhost:5080   (OpenAPI at /openapi/v1.json)
#   Worker health       http://localhost:5081/health/ready
#   Aspire dashboard    http://localhost:18888  (traces, metrics, structured logs)
#   Webhook receiver    http://localhost:8090/events  (what the demo merchant's endpoint received)
#   SQL Server          localhost,14333         (payments_app / LocalOnly_App_2026!)
#
# Every port binds to 127.0.0.1 only, and every host port can move: set DASHBOARD_PORT, API_PORT,
# WORKER_PORT, SQL_PORT, ASPIRE_DASHBOARD_PORT, OTLP_PORT, or WEBHOOK_RECEIVER_PORT in a gitignored .env
# (see .env.example).
# For the inner loop, run `docker compose up -d sqlserver sqlserver-init aspire-dashboard` and start
# the API and worker with `dotnet run`.

name: payment-platform

# Local-only credentials for local-only containers, public on purpose so the stack starts without a
# setup step. Override either in .env: the application password applies on every start, the sa
# password only when the sqlserver-data volume is created (`docker compose down -v` resets it).
# Azure has no passwords at all: the services use Entra managed identities (infra/).
x-sa-password: &sa-password ${MSSQL_SA_PASSWORD:-LocalOnly_Admin_2026!}
x-app-password: &app-password ${PAYMENTS_DB_PASSWORD:-LocalOnly_App_2026!}
x-payments-connection: &payments-connection Server=sqlserver,1433;Database=payments;User Id=payments_app;Password=${PAYMENTS_DB_PASSWORD:-LocalOnly_App_2026!};TrustServerCertificate=True

# The demo merchant's webhook signing secret, shared by the API's seed and the receiver that verifies it.
x-demo-webhook-secret: &demo-webhook-secret whsec_TG9jYWxPbmx5X0RlbW9fV2ViaG9va19TZWNyZXRfMjAyNg==

# The receiver is on the stack's private network, which the SSRF rules refuse; this lets webhooks reach it,
# and only it, and only in Development (both hosts refuse the setting elsewhere).
x-webhook-receiver-allowed: &webhook-receiver-allowed webhook-receiver

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU10-ubuntu-24.04
    # Built for x64 only; Docker Desktop on Apple silicon runs it under emulation.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      # Developer edition: the full engine, free for development and test.
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: *sa-password
    ports:
      - "127.0.0.1:${SQL_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One-shot: the database and the least-privilege application login (scripts/sql/create-local-database.sql).
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2025-CU10-ubuntu-24.04
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: *sa-password
      PAYMENTS_DB_PASSWORD: *app-password
    volumes:
      - ./scripts/sql:/scripts:ro
    entrypoint:
      - /bin/sh
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -b -i /scripts/create-local-database.sql -v AppPassword="$$PAYMENTS_DB_PASSWORD"
    restart: "no"

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.2
    environment:
      # Local only and bound to 127.0.0.1; a shared environment would use the dashboard's login token.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:${ASPIRE_DASHBOARD_PORT:-18888}:18888"
      - "127.0.0.1:${OTLP_PORT:-4317}:18889"

  api:
    build:
      context: ./backend
      target: api
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      <<: *otel
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: payment-api
      ConnectionStrings__Payments: *payments-connection
      Database__MigrateOnStartup: "true"
      # The demo merchant and its login (docs/demo.md); the API refuses this setting in Production.
      Demo__Seed: "true"
      Demo__WebhookUrl: http://webhook-receiver:8080/webhooks
      Demo__WebhookSecret: *demo-webhook-secret
      Webhooks__LocalReceiverHosts__0: *webhook-receiver-allowed
      # Empty by default: in Development the API then signs tokens with a key it generates at startup, so
      # logins end when it restarts. Set JWT_SIGNING_KEY in .env to keep them across restarts.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"

  worker:
    build:
      context: ./backend
      target: worker
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      <<: *otel
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: payment-worker
      ConnectionStrings__Payments: *payments-connection
      Webhooks__LocalReceiverHosts__0: *webhook-receiver-allowed
    ports:
      - "127.0.0.1:${WORKER_PORT:-5081}:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started
    environment:
      # Server-side only: the browser talks to the dashboard, the dashboard talks to the API and the
      # worker's readiness probe (ADR 004).
      API_ORIGIN: http://api:8080
      WORKER_ORIGIN: http://worker:8080
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3080}:3000"

  # Stands in for a merchant's server: verifies each delivery's signature and lists what arrived
  # (scripts/webhook-receiver.mjs).
  webhook-receiver:
    image: node:22-bookworm-slim
    command: ["node", "/app/webhook-receiver.mjs"]
    environment:
      WEBHOOK_SECRET: *demo-webhook-secret
    volumes:
      - ./scripts/webhook-receiver.mjs:/app/webhook-receiver.mjs:ro
    ports:
      - "127.0.0.1:${WEBHOOK_RECEIVER_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sqlserver-data:
